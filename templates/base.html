<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}OAuth2 Deep-Dive Lab{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
  <div class="hd-inner">
    <div class="brand"><i class="fa-solid fa-crosshairs"></i> OAuth2 Deep <span>LAB</span></div>
    <nav class="tabs" id="tabs">
      <a class="active" href="/"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="/provider"><i class="fa-solid fa-user-secret"></i> Provider Identity</a>
      <a href="/app/login"><i class="fa-brands fa-windows"></i> Client App</a>
      <a href="/evil/client"><i class="fa-solid fa-skull"></i> Evil App</a>
      <a href="/logs"><i class="fa-solid fa-bug"></i> Attacker Logs</a>
    </nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<div id="toast"></div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
